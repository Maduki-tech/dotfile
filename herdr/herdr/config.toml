[theme]
name = "catppuccin"

[ui]
agent_panel_sort = "spaces"

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# --- Tab management (mapping from tmux window commands) ---
new_tab = "prefix+c"            # c → new-window
rename_tab = "prefix+R"         # r → rename-window (shift+r to avoid conflict with resize_mode)
close_tab = "prefix+k"          # k → kill-window

# --- Workspace / session management ---
new_workspace = "prefix+C"      # C (shift+c) → new-session
close_workspace = "prefix+K"    # K (shift+k) → kill-session
previous_workspace = "alt+up"   # M-Up → switch-client -p (direct)
next_workspace = "alt+down"     # M-Down → switch-client -n (direct)

# --- Pane splits (Vim-style: h=below/down, v=right) ---
split_vertical = "prefix+s"     # h → split -v  (but h conflicts with focus, so use s for split)
split_horizontal = "prefix+v"   # v → split -h

# --- Pane navigation (matches C-M-Arrow direct chords) ---
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# --- Pane management ---
close_pane = "prefix+x"         # x → kill-pane
zoom = "prefix+z"
resize_mode = "prefix+r"        # enter resize mode → use arrows

# --- Tab navigation ---
switch_tab = "prefix+1..9"      # M-1..9 → select-window
previous_tab = "prefix+p"       # M-Left → previous-window
next_tab = "prefix+n"           # M-Right → next-window

# --- Workspace picker (replaces f → tmux-sessiongod.sh) ---
workspace_picker = "prefix+f"

# --- Config / help ---
reload_config = "prefix+q"      # q → source-file
help = "prefix+?"

# === Custom commands (ported from tmux keybinds) ===

# N → open/edit nvim config workspace
[[keys.command]]
key = "prefix+shift+N"
type = "shell"
command = "herdr workspace create --cwd ~/dotfile/nvim/nvim --label nvim --focus"

# o → open obsidian vault workspace
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr workspace create --cwd ~/vault --label vault --focus"

# i → cheatsheet lookup (ported cht.sh as herdr popup)
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "bash ~/.config/herdr/cht.sh"
width = "85%"
height = "80%"
